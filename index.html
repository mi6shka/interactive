<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверьте, как в компании настроен автоматический контроль</title>
<style>
:root{
  --lilac:#A8A3FF;
  --lilac-deep:#716BDB;
  --lilac-pale:#F4F2FF;
  --text:#2F3040;
  --muted:#6F7080;
  --gold:#C7A34A;
  --border:#DDD9F5;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:32px;
  background:#fff;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  color:var(--text);
}
.widget{
  max-width:980px;
  margin:0 auto;
  padding:30px;
  border:1px solid var(--border);
  border-radius:24px;
  background:linear-gradient(135deg,#FAF9FF 0%,#F1EFFF 100%);
  box-shadow:0 18px 44px rgba(78,70,150,.09);
}
h1{
  margin:0 0 10px;
  max-width:760px;
  font-size:28px;
  line-height:1.2;
  color:#504B8D;
}
.subtitle{
  margin:0 0 26px;
  font-size:16px;
  line-height:1.5;
  color:var(--muted);
}
.content{
  display:grid;
  grid-template-columns:210px minmax(0,1fr);
  gap:18px;
}
.tabs{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.tab{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:62px;
  padding:10px 13px;
  border:1px solid #D9D5F2;
  border-radius:17px;
  background:rgba(255,255,255,.72);
  color:#4D4C61;
  font:600 15px/1.25 Inter,"Segoe UI",Arial,sans-serif;
  text-align:left;
  cursor:pointer;
  transition:.2s ease;
}
.tab:hover{
  border-color:var(--lilac);
  transform:translateY(-1px);
}
.tab.active{
  background:var(--lilac);
  border-color:var(--lilac);
  color:#292742;
  box-shadow:0 8px 20px rgba(113,107,219,.18);
}
.number{
  flex:0 0 31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff;
  color:var(--lilac-deep);
  font-weight:800;
}
.card{
  position:relative;
  min-height:300px;
  padding:30px 32px 58px;
  overflow:hidden;
  border:1px solid #E3E0F1;
  border-radius:22px;
  background:#fff;
  box-shadow:0 12px 28px rgba(66,61,121,.08);
}
.card::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:6px;
  background:var(--lilac);
}
.card h2{
  margin:0 0 20px;
  color:#625DB0;
  font-size:23px;
  line-height:1.25;
}
.card p{
  margin:0;
  font-size:17px;
  line-height:1.65;
}
.card strong{color:#34334A}
.progress{
  position:absolute;
  left:32px;
  right:32px;
  bottom:25px;
  height:18px;
}
.track{
  position:absolute;
  left:0; right:0; top:8px;
  height:2px;
  background:#DDD8C8;
}
.fill{
  position:absolute;
  left:0; top:8px;
  height:2px;
  background:var(--gold);
  transition:width .25s ease;
}
.knob{
  position:absolute;
  top:2px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 4px rgba(199,163,74,.14);
  transform:translateX(-7px);
  transition:left .25s ease;
}
@media(max-width:720px){
  body{padding:14px}
  .widget{padding:20px;border-radius:20px}
  h1{font-size:24px}
  .content{grid-template-columns:1fr}
  .tabs{display:grid;grid-template-columns:1fr 1fr}
  .tab{min-height:58px}
  .card{min-height:330px;padding:25px 25px 56px}
  .progress{left:25px;right:25px}
}
@media(max-width:470px){
  .tabs{grid-template-columns:1fr}
}
</style>
</head>
<body>
<section class="widget">
  <h1>Проверьте, как в компании настроен автоматический контроль</h1>
  <p class="subtitle">Переключайте карточки и смотрите, какие принципы важно соблюдать, чтобы автоматизация работала эффективно.</p>

  <div class="content">
    <nav class="tabs" aria-label="Принципы автоматического контроля">
      <button class="tab active" type="button" data-index="0">
        <span class="number">1</span><span>Данные и процессы</span>
      </button>
      <button class="tab" type="button" data-index="1">
        <span class="number">2</span><span>Человек и технологии</span>
      </button>
      <button class="tab" type="button" data-index="2">
        <span class="number">3</span><span>Актуальность алгоритма</span>
      </button>
      <button class="tab" type="button" data-index="3">
        <span class="number">4</span><span>Согласование операций</span>
      </button>
    </nav>

    <article class="card" aria-live="polite">
      <h2 id="cardTitle"></h2>
      <p id="cardText"></p>
      <div class="progress" aria-hidden="true">
        <div class="track"></div>
        <div class="fill" id="fill"></div>
        <div class="knob" id="knob"></div>
      </div>
    </article>
  </div>
</section>

<script>
const cards = [
  {
    title: "Данные и процессы",
    text: "<strong>Проверьте:</strong> вводные, на которых будет работать алгоритм. Технологии эффективны там, где есть качественные данные и правильно настроены бизнес-процессы."
  },
  {
    title: "Человек и технологии",
    text: "<strong>Сочетайте:</strong> аналитику и профессиональное суждение. Задача системы — вовремя отследить отклонения, а эксперта — истолковать данные, найти и устранить первопричину."
  },
  {
    title: "Актуальность алгоритма",
    text: "<strong>Сохраняйте актуальность:</strong> мошеннические схемы меняются, поэтому системы должны меняться вместе с ними. Если нарушители используют новые методы, механизмы для их выявления нужно закладывать в алгоритм."
  },
  {
    title: "Согласование операций",
    text: "<strong>Добавьте одобрение:</strong> для наиболее важных операций в цепочку согласования можно включить лицо, которое должно их одобрить. Например, руководитель должен давать согласие на транзакции суммой более 1 млн руб., и это должно отражаться в системе."
  }
];

const tabs = [...document.querySelectorAll(".tab")];
const cardTitle = document.getElementById("cardTitle");
const cardText = document.getElementById("cardText");
const fill = document.getElementById("fill");
const knob = document.getElementById("knob");

function showCard(index){
  tabs.forEach((tab,i) => tab.classList.toggle("active", i === index));
  cardTitle.textContent = cards[index].title;
  cardText.innerHTML = cards[index].text;

  const progress = index / (cards.length - 1) * 100;
  fill.style.width = progress + "%";
  knob.style.left = progress + "%";
}

tabs.forEach(tab => {
  tab.addEventListener("click", () => showCard(Number(tab.dataset.index)));
});

showCard(0);
</script>
</body>
</html>
